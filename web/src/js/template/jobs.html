<div>
  {{#if needs_refresh}}
  <button type="button" class="btn btn-sm btn-outline-secondary {{refresh_class}}">
    Refresh
  </button>
  {{/if}}
</div>

{{#if error}}
<div class="alert alert-danger">
  {{error}}
</div>
{{/if}}

{{#if jobs}}
<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Job ID</th>
        <th>Status</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {{#jobs}}
      <tr>
        <td>
          <code class="text-primary clickable-job-id" style="cursor: pointer;" data-job-id="{{job_id}}">{{job_id}}</code>
        </td>
        <td>
          <span class="badge bg-secondary">{{status}}</span>
        </td>
        <td class="text-muted">{{created_time}}</td>
        <td>
          <button type="button" class="btn btn-sm btn-outline-primary clone-job me-2" data-job-id="{{job_id}}" title="Clone this job">
            <i class="fa-solid fa-clone"></i> Clone
          </button>
          <button type="button" class="btn btn-sm btn-outline-danger delete-job" data-job-id="{{job_id}}">
            Delete
          </button>
        </td>
      </tr>
      {{/jobs}}
    </tbody>
  </table>
</div>
{{else}}
<div class="text-center py-5">
  <p class="text-muted mb-3">No active jobs found</p>
  <a href="#new" class="btn btn-primary">Create Your First Job</a>
</div>
{{/if}}
