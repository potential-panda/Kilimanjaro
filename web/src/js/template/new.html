<div class="card">
  <div class="card-header">
    <h5 class="card-title mb-0">Create New Backtest Job</h5>
  </div>
  <div class="card-body">
    <!-- Success alert (hidden by default) -->
    <div class="alert alert-success alert-dismissible fade show d-none success-alert" role="alert">
      <strong>Success!</strong> <span class="success-message"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="strategy_name" class="form-label">Strategy Name</label>
          <select class="form-control" name="strategy_name" required>
            {{#available_strategies}}
            <option value="{{.}}">{{.}}</option>
            {{/available_strategies}}
          </select>
        </div>
        <div class="col-md-6">
          <label for="variant" class="form-label">Strategy Variant</label>
          <input type="text" class="form-control" name="variant" value="{{variant}}" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="from_dt" class="form-label">From Date</label>
          <input type="date" class="form-control" name="from_dt" value="{{from_dt}}" required>
        </div>
        <div class="col-md-6">
          <label for="to_dt" class="form-label">To Date (optional)</label>
          <input type="date" class="form-control" name="to_dt" value="{{to_dt}}">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" name="optimize" {{#optimize}}checked{{/optimize}}>
            <label class="form-check-label" for="optimize">Optimize</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" name="retest" {{#retest}}checked{{/retest}}>
            <label class="form-check-label" for="retest">Retest</label>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Configuration</label>
        <div class="config-grid">
          {{#config}}
          <div class="card mb-2" data-index="{{@index}}">
            <div class="card-body py-2">
              <div class="row g-2 align-items-center">
                <div class="col-md-3">
                  <label class="form-label-sm mb-0">{{name}}</label>
                  <input type="hidden" name="config_name[]" data-config-name="{{name}}" value="{{name}}">
                </div>
                <div class="col-md-9">
                  {{#if is_select}}
                  <select class="form-control form-control-sm" name="config_value[]" data-config-name="{{name}}">
                    {{#options}}
                    <option value="{{.}}" {{#if @first}}selected{{/if}}>{{.}}</option>
                    {{/options}}
                  </select>
                  {{else}}
                  <input type="text" class="form-control form-control-sm" name="config_value[]" data-config-name="{{name}}" value="{{default_value}}">
                  {{/if}}
                </div>
              </div>
            </div>
          </div>
          {{/config}}
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label mb-0">Parameter Grid</label>
          <button type="button" class="btn btn-sm btn-outline-primary add-param">Add Parameter</button>
        </div>

        <div class="param-grid">
          {{#param_grid}}
          <div class="card mb-2" data-index="{{@index}}">
            <div class="card-body py-2">
              <div class="row g-2 align-items-center">
                <div class="col-md-3">
                  <input type="text" class="form-control form-control-sm" name="param_name[]" placeholder="Parameter Name" value="{{name}}">
                </div>
                <div class="col-md-2">
                  <input type="text" class="form-control form-control-sm" name="param_default[]" placeholder="Default" value="{{default_value}}">
                </div>
                <div class="col-md-4">
                  <input type="text" class="form-control form-control-sm" name="param_values[]" placeholder="Values (comma separated)" value="{{values}}">
                </div>
                <div class="col-md-2">
                  <input type="number" class="form-control form-control-sm" name="param_factor[]" placeholder="Factor" value="{{factor}}">
                </div>
                <div class="col-md-1">
                  <button type="button" class="btn btn-sm btn-outline-danger remove-param" data-index="{{@index}}">×</button>
                </div>
              </div>
            </div>
          </div>
          {{/param_grid}}
        </div>
      </div>

      <div class="d-flex justify-content-between">
        <a href="#list" class="btn btn-secondary">Cancel</a>
        <button type="button" class="btn btn-primary submit-job">Create Job</button>
      </div>
    </form>
  </div>
</div>
