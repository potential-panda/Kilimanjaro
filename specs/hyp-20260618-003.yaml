schema_version: 1
hypothesis:
  id: hyp-20260618-003
  parent_id: null
  title: "BINANCE BTC_USDT 1-tick momentum predicts GMO BTC_JPY 120s mid return"
  status: draft
  family: lead_lag
  family_label: "Lead-lag between venues or execution sizes"
  custom_family_justification: null
  created_at: "2026-06-19T00:00:00Z"
  owner: agent
  summary: >
    BINANCE's own most recent tick-to-tick price move (not its order book
    state) as the directional signal for GMO BTC_JPY -- a textbook
    lead-lag momentum-transfer hypothesis, distinct from the order-book
    state signals in hyp-20260618-001/002.
  expected_edge_mechanism: >
    Price discovery happens first on BINANCE; a price move there has not
    yet propagated to GMO. The most recent realized 1-tick return on
    BINANCE is therefore informative about GMO's near-future return,
    because BINANCE leads GMO BTC_JPY 81-97% of the time
    (markets/waves/leadlag_BINANCE_GMO_BTC.csv) and the lag has not fully
    closed within the 120s horizon.
  economic_rationale: "GMO market makers reprice with a lag after observing (or being arbitraged against) BINANCE price moves."
  duplicate_search:
    searched_at: "2026-06-19T00:00:00Z"
    query_terms:
      - lead_lag
      - momentum
      - BINANCE
      - BTC_JPY
    possible_duplicates: []
    conclusion: new
  data_requirements:
    markets:
      - exchange: BINANCE
        symbol: BTC_USDT
      - exchange: GMO
        symbol: BTC_JPY
    datasets:
      - layer: bronze
        dataset: OrderBook
    minimum_distinct_days: 5
    required_columns: ["bid0_price", "ask0_price"]
    unavailable_data_policy: needs-more-data
    research_metadata: null
  feature:
    sql_expression: "((bid0_price+ask0_price)/2.0 - avg((bid0_price+ask0_price)/2.0) OVER (ORDER BY ts ROWS BETWEEN 1 PRECEDING AND 1 PRECEDING)) / avg((bid0_price+ask0_price)/2.0) OVER (ORDER BY ts ROWS BETWEEN 1 PRECEDING AND 1 PRECEDING)"
    source_datasets:
      - layer: bronze
        dataset: OrderBook
        exchange: BINANCE
        symbol: BTC_USDT
    primary_timestamp_column: ts
    point_in_time_rule: >
      feature uses only the current and immediately preceding BINANCE
      OrderBook rows (ROWS BETWEEN 1 PRECEDING AND 1 PRECEDING), both at
      or before signal ts -- no look-ahead.
  cross_market_rationale: >
    Same rationale as hyp-20260618-001: feature is computed on
    BINANCE:BTC_USDT, target return is on GMO:BTC_JPY, because BINANCE
    leads GMO 81-97% of the time. This hypothesis tests momentum transfer
    specifically, not order-book state, as a structurally different
    mechanism within the same cross-market relationship.
  target:
    type: next_return
    primary_horizon_seconds: 120
    comparison_horizons_seconds: [30, 120, 300]
    source_dataset:
      layer: bronze
      dataset: OrderBook
      exchange: GMO
      symbol: BTC_JPY
    timestamp_cutoff_rule: "target window starts strictly after signal timestamp"
  execution_assumptions:
    order_type: market
    fees_bps: 0  # markets/registry.yaml: GMO BTC_JPY fee_bps=0 -- authoritative, not a guess
    half_spread_included: false
    half_spread_bps: 0.92  # avg_spread/avg_mid for GMO/BTC_JPY computed directly over 2026-05-01..15 (the exact scanned window), not a stale full-history estimate
    slippage_bps: 0.5  # markets/registry.yaml: default_slippage_bps, from ~1 year of real trading -- authoritative, not a guess
    latency_ms: 100
    liquidity_capacity_assumption: "single-unit notional, no capacity scaling in v1 scan"
  falsification_tests:
    - name: "momentum-is-just-noise-autocorrelation"
      expected_failure_meaning: "effect vanishes once corrected for autocorrelation (tick-to-tick noise, not real momentum transfer)"
  scan_plan:
    primary_horizon_seconds: 120
    threshold_grid: [30, 120, 300]
    regime_buckets: ["low_vol", "mid_vol", "high_vol"]
    significance_method: block_bootstrap_by_day
  backtest_handoff_intent:
    potential_panda_core_strategy_pattern: "qate.trading.strategy variant, momentum-threshold entry"
    himalaya_config_notes: "GMO/BTC_JPY, execution_size TBD from capacity scan"
  decisions:
    - at: "2026-06-19T00:00:00Z"
      actor: agent
      decision: draft
      reason: "initial spec drafted; first test of the lead_lag family (momentum transfer, not order-book state)"
