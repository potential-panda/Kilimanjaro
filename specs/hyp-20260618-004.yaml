schema_version: 1
hypothesis:
  id: hyp-20260618-004
  parent_id: null
  title: "BINANCE BTC_USDT depth pull/refill asymmetry predicts GMO BTC_JPY 120s mid return"
  status: draft
  family: depth_pull_refill_asymmetry
  family_label: "Depth pull/refill asymmetry"
  custom_family_justification: null
  created_at: "2026-06-19T00:00:00Z"
  owner: agent
  summary: >
    Tick-to-tick change in best-bid size minus change in best-ask size on
    BINANCE: bid growing faster than ask (or ask shrinking faster than bid)
    signals net bullish liquidity-provider repositioning ahead of GMO's
    price catching up.
  expected_edge_mechanism: >
    Faster passive refill on the bid than the ask (or faster pull on the
    ask than the bid) indicates liquidity providers pricing in directional
    risk before a move, on the leading market (BINANCE). GMO BTC_JPY has
    not yet caught up (BINANCE leads 81-97% of the time, per
    markets/waves/leadlag_BINANCE_GMO_BTC.csv), so this asymmetry is
    informative for GMO's near-future return.
  economic_rationale: "Liquidity providers adjust resting size asymmetrically when they perceive adverse-selection risk on one side before price actually moves."
  duplicate_search:
    searched_at: "2026-06-19T00:00:00Z"
    query_terms:
      - depth_pull_refill_asymmetry
      - pull
      - refill
      - BINANCE
      - BTC_JPY
    possible_duplicates: []
    conclusion: new
  data_requirements:
    markets:
      - exchange: BINANCE
        symbol: BTC_USDT
      - exchange: GMO
        symbol: BTC_JPY
    datasets:
      - layer: bronze
        dataset: OrderBook
    minimum_distinct_days: 5
    required_columns: ["bid0_qty", "ask0_qty"]
    unavailable_data_policy: needs-more-data
    research_metadata: null
  feature:
    sql_expression: "(bid0_qty - avg(bid0_qty) OVER (ORDER BY ts ROWS BETWEEN 1 PRECEDING AND 1 PRECEDING)) - (ask0_qty - avg(ask0_qty) OVER (ORDER BY ts ROWS BETWEEN 1 PRECEDING AND 1 PRECEDING))"
    source_datasets:
      - layer: bronze
        dataset: OrderBook
        exchange: BINANCE
        symbol: BTC_USDT
    primary_timestamp_column: ts
    point_in_time_rule: >
      feature uses only the current and immediately preceding BINANCE
      OrderBook rows (ROWS BETWEEN 1 PRECEDING AND 1 PRECEDING), both at
      or before signal ts -- no look-ahead.
  cross_market_rationale: >
    Same rationale as hyp-20260618-001: feature is computed on
    BINANCE:BTC_USDT, target return is on GMO:BTC_JPY, because BINANCE
    leads GMO 81-97% of the time.
  target:
    type: next_return
    primary_horizon_seconds: 120
    comparison_horizons_seconds: [30, 120, 300]
    source_dataset:
      layer: bronze
      dataset: OrderBook
      exchange: GMO
      symbol: BTC_JPY
    timestamp_cutoff_rule: "target window starts strictly after signal timestamp"
  execution_assumptions:
    order_type: market
    fees_bps: 0  # markets/registry.yaml: GMO BTC_JPY fee_bps=0 -- authoritative, not a guess
    half_spread_included: false
    half_spread_bps: 0.92  # avg_spread/avg_mid for GMO/BTC_JPY computed directly over 2026-05-01..15 (the exact scanned window), not a stale full-history estimate
    slippage_bps: 0.5  # markets/registry.yaml: default_slippage_bps, from ~1 year of real trading -- authoritative, not a guess
    latency_ms: 100
    liquidity_capacity_assumption: "single-unit notional, no capacity scaling in v1 scan"
  falsification_tests:
    - name: "asymmetry-is-just-volatility-proxy"
      expected_failure_meaning: "the asymmetry only correlates with overall volatility, not direction -- a confound, not a directional signal"
  scan_plan:
    primary_horizon_seconds: 120
    threshold_grid: [30, 120, 300]
    regime_buckets: ["low_vol", "mid_vol", "high_vol"]
    significance_method: block_bootstrap_by_day
  backtest_handoff_intent:
    potential_panda_core_strategy_pattern: "qate.trading.strategy variant, depth-asymmetry entry"
    himalaya_config_notes: "GMO/BTC_JPY, execution_size TBD from capacity scan"
  decisions:
    - at: "2026-06-19T00:00:00Z"
      actor: agent
      decision: draft
      reason: "initial spec drafted; first test of the depth_pull_refill_asymmetry family"
