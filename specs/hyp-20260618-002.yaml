schema_version: 1
hypothesis:
  id: hyp-20260618-002
  parent_id: null
  title: "BINANCE BTC_USDT microprice deviation predicts GMO BTC_JPY 120s mid return"
  status: draft
  family: weighted_imbalance_microprice
  family_label: "Weighted imbalance and microprice"
  custom_family_justification: null
  created_at: "2026-06-18T00:00:00Z"
  owner: agent
  summary: >
    Microprice (depth-weighted fair value) on BINANCE diverges from plain
    mid; that divergence is a less noisy directional signal than raw
    top-of-book imbalance (hyp-20260618-001), tested on the same
    BINANCE-leads-GMO mechanism.
  expected_edge_mechanism: >
    Microprice = (bid_price*ask_qty + ask_price*bid_qty) / (bid_qty+ask_qty)
    weights the fair-value estimate toward the side with less resting size,
    i.e. the side more likely to be consumed next. When microprice deviates
    from plain mid on BINANCE, that deviation reflects near-term order-flow
    pressure not yet reflected in GMO's price, since BINANCE leads GMO
    BTC_JPY 81-97% of the time (markets/waves/leadlag_BINANCE_GMO_BTC.csv).
  economic_rationale: "Microprice is a standard, less noisy fair-value proxy than mid; its deviation from mid should be a cleaner directional signal than raw imbalance."
  duplicate_search:
    searched_at: "2026-06-19T00:00:00Z"
    query_terms:
      - microprice
      - weighted_imbalance_microprice
      - BINANCE
      - BTC_JPY
    possible_duplicates: []
    conclusion: variant
  data_requirements:
    markets:
      - exchange: BINANCE
        symbol: BTC_USDT
      - exchange: GMO
        symbol: BTC_JPY
    datasets:
      - layer: bronze
        dataset: OrderBook
    minimum_distinct_days: 5
    required_columns: ["bid0_price", "bid0_qty", "ask0_price", "ask0_qty"]
    unavailable_data_policy: needs-more-data
    research_metadata: null
  feature:
    sql_expression: "((bid0_price*ask0_qty + ask0_price*bid0_qty) / (bid0_qty + ask0_qty) - (bid0_price + ask0_price) / 2.0) / ((bid0_price + ask0_price) / 2.0)"
    source_datasets:
      - layer: bronze
        dataset: OrderBook
        exchange: BINANCE
        symbol: BTC_USDT
    primary_timestamp_column: ts
    point_in_time_rule: "feature computed strictly from BINANCE OrderBook rows at or before signal ts; no lag, purely point-in-time"
  cross_market_rationale: >
    Same rationale as hyp-20260618-001: feature is computed on
    BINANCE:BTC_USDT, target return is on GMO:BTC_JPY, because BINANCE
    leads GMO 81-97% of the time.
  target:
    type: next_return
    primary_horizon_seconds: 120
    comparison_horizons_seconds: [30, 120, 300]
    source_dataset:
      layer: bronze
      dataset: OrderBook
      exchange: GMO
      symbol: BTC_JPY
    timestamp_cutoff_rule: "target window starts strictly after signal timestamp"
  execution_assumptions:
    order_type: market
    fees_bps: 0  # markets/registry.yaml: GMO BTC_JPY fee_bps=0 -- authoritative, not a guess
    half_spread_included: false
    half_spread_bps: 0.92  # avg_spread/avg_mid for GMO/BTC_JPY computed directly over 2026-05-01..15 (the exact scanned window), not a stale full-history estimate
    slippage_bps: 0.5  # markets/registry.yaml: default_slippage_bps, from ~1 year of real trading -- authoritative, not a guess
    latency_ms: 100
    liquidity_capacity_assumption: "single-unit notional, no capacity scaling in v1 scan"
  falsification_tests:
    - name: "no-incremental-value-over-imbalance"
      expected_failure_meaning: "microprice deviation IC is no better than hyp-20260618-001's raw imbalance IC -- no incremental value from the depth-weighting"
  scan_plan:
    primary_horizon_seconds: 120
    threshold_grid: [30, 120, 300]
    regime_buckets: ["low_vol", "mid_vol", "high_vol"]
    significance_method: block_bootstrap_by_day
  backtest_handoff_intent:
    potential_panda_core_strategy_pattern: "qate.trading.strategy variant, microprice-deviation entry"
    himalaya_config_notes: "GMO/BTC_JPY, execution_size TBD from capacity scan"
  decisions:
    - at: "2026-06-19T00:00:00Z"
      actor: agent
      decision: draft
      reason: "initial spec drafted; variant of hyp-20260618-001 testing microprice instead of raw imbalance"
