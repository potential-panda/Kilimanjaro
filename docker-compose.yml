version: '3.8'

services:
  api:
    build: .
    container_name: kilimanjaro-api
    ports:
      - "8766:8766"
    volumes:
      - ${HOME}/env:/root/env
      - ${HOME}/.ssh:/root/.ssh:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - kilimanjaro

networks:
  kilimanjaro:
    driver: bridge
