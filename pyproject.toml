[project]
name = "kilimanjaro"
version = "0.1.0"
description = "Orchestration workspace for AI-assisted trading strategy discovery"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "referencing>=0.30",
    "duckdb>=1.0",
    "pandas>=2.0",
    "matplotlib>=3.9",
    "sqlglot>=25.0",
    "scipy>=1.11",
    "numpy>=1.24",
    "flask>=3.0",
    "kamakuraquantlab-hase>=0.8.0",
    "makalu>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kilimanjaro*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
