[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "potential-panda-kilimanjaro"
version = "0.1.0"
description = "Kilimanjaro job agent for the qate trading system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "potential-panda"},
]
dependencies = [
    "potential-panda-core @ git+ssh://git@github.com/potential-panda/potential-panda-core.git@main",
    "Flask==3.1.0",
    "Flask-CORS==5.0.0",
    "httpx==0.28.1",
    "schedule==1.2.2",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["kilimanjaro*"]
