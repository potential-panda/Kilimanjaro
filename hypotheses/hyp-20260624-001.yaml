schema_version: 1
hypothesis:
  id: hyp-20260624-001
  parent_id: null
  title: "BINANCE BTC_USDT range-bar SAR predicts GMO BTC_JPY 120s forward return"
  status: draft
  family: custom
  family_label: "Range-bar trend (Parabolic SAR)"
  custom_family_justification: >
    No existing v1 family describes a trend-following signal computed from
    event-driven (price-range-triggered, not time-triggered) bars. This is
    the orion v601 live strategy's own signal (qate.trading.chart.RangeBarBuilder
    + orion.parabolic_sar.ParabolicSarIndicator, params acceleration=0.02,
    step=0.02, maximum=0.2, box_size_rate=0.0025 -- matching the live prod
    params for XRP/ETH instances; no BTC instance is currently live), being
    tested here for whether it carries genuine statistical edge as a
    directional signal, independent of orion's own execution-price entry logic.
  created_at: "2026-06-24T00:00:00Z"
  owner: agent
  summary: >
    Range bars built from BINANCE BTC_USDT trade ticks (box_size_rate=0.0025,
    the live prod param): does the Parabolic SAR trend direction (sar_up)
    computed on BINANCE predict the GMO BTC_JPY forward return? This is the
    actual orion v601 architecture: ref_market=BINANCE fires Trade events
    which drive RangeBarBuilder → SAR; execution happens on GMO at GMO price.
  expected_edge_mechanism: >
    BINANCE leads GMO by a few seconds (confirmed by lead-lag wave). Range
    bars on BINANCE filter noise and only close when price has genuinely moved
    by 0.25%. A SAR flip on BINANCE therefore represents a trend-direction
    change that GMO has not yet fully priced in, giving a brief window to
    enter on GMO in the BINANCE-confirmed direction.
  economic_rationale: "Trend persistence after a range-bar-confirmed price move, consistent with momentum continuing briefly before mean-reverting liquidity providers catch up."
  duplicate_search:
    searched_at: "2026-06-24T00:00:00Z"
    query_terms:
      - parabolic
      - sar
      - range bar
      - trend
      - BTC_JPY
    possible_duplicates: []
    conclusion: new
  data_requirements:
    markets:
      - exchange: BINANCE
        symbol: BTC_USDT
      - exchange: GMO
        symbol: BTC_JPY
    datasets:
      - layer: feature
        dataset: ChartRangeSAR
      - layer: bronze
        dataset: OrderBook
    minimum_distinct_days: 5
    required_columns: ["sar_up", "sar_flip", "sar_level"]
    unavailable_data_policy: needs-more-data
    research_metadata: null
  feature:
    sql_expression: "sar_up"
    source_datasets:
      - layer: feature
        dataset: ChartRangeSAR
        exchange: BINANCE
        symbol: BTC_USDT
    primary_timestamp_column: ts
    point_in_time_rule: "sar_up computed from BINANCE BTC_USDT range bars closed at or before signal ts; SAR cross detected at the exact crossing trade tick (orion v601 live logic)"
  cross_market_rationale: >
    BINANCE is the signal source by design, matching orion v601's live
    architecture: ref_market=BINANCE:BTC_USDT provides Trade events that
    drive RangeBarBuilder → ParabolicSarIndicator; execution is on
    GMO:BTC_JPY. Using BINANCE as the feature source is not a
    data-quality workaround — it is the actual causal structure of the
    strategy being evaluated.
  target:
    type: next_return
    primary_horizon_seconds: 120
    comparison_horizons_seconds: [30, 120, 300]
    source_dataset:
      layer: bronze
      dataset: OrderBook
      exchange: GMO
      symbol: BTC_JPY
    timestamp_cutoff_rule: "target window starts strictly after signal timestamp"
  execution_assumptions:
    order_type: market
    fees_bps: 0  # markets/registry.yaml: GMO BTC_JPY fee_bps=0 -- authoritative, not a guess
    slippage_bps: 0.5  # markets/registry.yaml: default_slippage_bps, from ~1 year of real trading -- authoritative, not a guess
    latency_ms: 100
    liquidity_capacity_assumption: "single-unit notional, no capacity scaling in v1 scan"
  falsification_tests:
    - name: "sar-only-on-one-day"
      expected_failure_meaning: "effect disappears once tested across >=5 distinct days"
    - name: "sign-flips-across-horizons"
      expected_failure_meaning: "IC sign is not consistent across the 30/120/300s horizon grid"
  scan_plan:
    primary_horizon_seconds: 120
    threshold_grid: [30, 120, 300]
    regime_buckets: ["low_vol", "mid_vol", "high_vol"]
    significance_method: block_bootstrap_by_day
  backtest_handoff_intent:
    potential_panda_core_strategy_pattern: "orion v601 variant (qate.trading.chart.RangeBarBuilder + orion.parabolic_sar.ParabolicSarIndicator)"
    himalaya_config_notes: "ref_market=BINANCE/BTC_USDT, market=GMO/BTC_JPY, box_size_rate=0.0025, acceleration=0.02, step=0.02, maximum=0.2"
  decisions:
    - at: "2026-06-24T00:00:00Z"
      actor: agent
      decision: draft
      reason: "initial spec drafted"
