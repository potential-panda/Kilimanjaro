handoff:
  hypothesis_id: hyp-20260703-002
  ledger_approval_event_id: evt-20260703-006
  intended_strategy_family: Range-bar SAR between-flip execution, schedule-adaptive
  description: >
    Schedule-adaptive flip scan — active and inactive JST hour windows are traded
    with independently chosen (box, step) params per market. Same rolling_dd gate.
    Weekday-only rule for hour blocks (jst_weekday <= 4); weekends are fully
    included in inactive window.
  entry_exit_sketch: >
    Same signal and entry/exit as hyp-20260703-001. Key difference: two sets of
    (box, step) params per market — one for the active JST window (higher
    spread/volatility) and one for the inactive window (lower spread, more
    micro-trend). schedule_name selects which BINANCE ChartRangeSAR partition
    and which JST hour filter to apply. The two schedules run as independent
    strategies and their combined P&L is the total edge.
  potential_panda_core_mapping:
    base_contract: qate.trading.strategy
    example_variant_reference: orion v601 (schedule-adaptive variant)
    schedule_modes:
      - xrp_active      # XRP JST 07–21 weekdays + block all Saturday
      - xrp_inactive    # XRP JST 22–06 weekdays + weekends included
      - default_active  # ETH/BTC JST 06–21 weekdays + block all Saturday
      - default_inactive # ETH/BTC JST 22–05 weekdays + weekends included
    schedule_registry: tools/flip_scan.py SCHEDULES dict
    open_questions:
      - How to run two concurrent schedules (active+inactive) on the same market
        in Himalaya — separate strategy instances or a single branching strategy?
      - Confirm rolling_dd gate is independent per schedule instance
      - Schedule string param in orion config: replace schedule_version int with
        schedule_name str (xrp_active / xrp_inactive / default_active / default_inactive)

  himalaya_run_config:
    source_param_grid: handoffs/flip_scan_param_grid.yaml
    combos_for_this_hypothesis:
      - xrp-active-1
      - xrp-active-2
      - xrp-inactive-1
      - xrp-inactive-2
      - eth-active-1
      - eth-active-2
      - eth-inactive-1
      - eth-inactive-2
      - btc-active-1
      - btc-active-2
      - btc-inactive-1
      - btc-inactive-2
    markets:
      - {exchange: BINANCE, symbol: XRP_USDT}
      - {exchange: GMO,     symbol: XRP_JPY}
      - {exchange: BINANCE, symbol: ETH_USDT}
      - {exchange: GMO,     symbol: ETH_JPY}
      - {exchange: BINANCE, symbol: BTC_USDT}
      - {exchange: GMO,     symbol: BTC_JPY}
    train_window:   {start_date: "2025-07-01", end_date: "2026-01-05"}
    test_window:    {start_date: "2026-01-06", end_date: "2026-03-19"}
    forward_window: {start_date: "2026-03-20", end_date: "2026-06-29"}
    execution_model:
      fees_bps: 0
      slippage_bps: 0.5
      latency_ms: 100
      execution_sizes: {XRP_JPY: "150", ETH_JPY: "0.1", BTC_JPY: "0.002"}
    gate:
      rolling_dd_window_seconds: 21600
      rolling_dd_threshold_bps: 1000

