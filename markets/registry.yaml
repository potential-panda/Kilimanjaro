# Kilimanjaro tradeable market universe.
#
# This is the only set of markets Kilimanjaro targets. Every market here
# must exist as bronze data in Makalu (exchange/symbol match exactly) --
# confirmed against the live Makalu instance on 2026-06-18.
#
# fee_bps is the taker fee in basis points unless order_type is limit_only,
# in which case it's the maker fee (negative = rebate). half_spread_included
# in a hypothesis spec's execution_assumptions should be combined with this
# fee when computing the cost buffer in evaluation-framework.md.
schema_version: 1
markets:
  - exchange: COINCHECK
    symbol: BTC_SPOT
    asset: BTC
    quote: JPY
    leveraged: false
    order_type: any
    fee_bps: 0
  - exchange: COINCHECK
    symbol: ETH_SPOT
    asset: ETH
    quote: JPY
    leveraged: false
    order_type: any
    fee_bps: 0
  - exchange: COINCHECK
    symbol: XRP_SPOT
    asset: XRP
    quote: JPY
    leveraged: false
    order_type: any
    fee_bps: 0

  - exchange: GMO
    symbol: BTC_SPOT
    asset: BTC
    quote: JPY
    leveraged: false
    order_type: limit_only
    fee_bps: -0.01
  - exchange: GMO
    symbol: ETH_SPOT
    asset: ETH
    quote: JPY
    leveraged: false
    order_type: limit_only
    fee_bps: -0.01
  - exchange: GMO
    symbol: XRP_SPOT
    asset: XRP
    quote: JPY
    leveraged: false
    order_type: limit_only
    fee_bps: -0.01

  - exchange: GMO
    symbol: BTC_JPY
    asset: BTC
    quote: JPY
    leveraged: true
    order_type: any
    fee_bps: 0
  - exchange: GMO
    symbol: ETH_JPY
    asset: ETH
    quote: JPY
    leveraged: true
    order_type: any
    fee_bps: 0
  - exchange: GMO
    symbol: XRP_JPY
    asset: XRP
    quote: JPY
    leveraged: true
    order_type: any
    fee_bps: 0

  - exchange: BITBANK
    symbol: BTC_SPOT
    asset: BTC
    quote: JPY
    leveraged: false
    order_type: any
    fee_bps: 0
  - exchange: BITBANK
    symbol: ETH_SPOT
