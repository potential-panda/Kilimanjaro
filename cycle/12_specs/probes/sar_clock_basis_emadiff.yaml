hypothesis_id: probe-clock-basis_emadiff
family: flip
# CONTINUOUS-BET probe: identical SAR flip CLOCK, direction taken from a factor
# instead of from SAR. Same entries, same exits, same gate — only the side differs,
# so any difference is attributable purely to the direction rule.
signal: sar_flip
flip: {exchange: BINANCE, symbol: BTC_USDT}
step: 0.04
schedule: nofilter
return_calc: between_signal
direction_expr: "zscore(ema(diff(a_mid / b_mid, 1), 2), 1800)"
markets:
  a: {exchange: BINANCE, symbol: BTC_USDT, execution_size: '0.002'}
  b: {exchange: COINCHECK, symbol: BTC_SPOT, execution_size: '0.002'}
target: {exchange: COINCHECK, symbol: BTC_SPOT, execution_size: '0.002'}
boxes: [0.0015, 0.0025, 0.003, 0.005]
