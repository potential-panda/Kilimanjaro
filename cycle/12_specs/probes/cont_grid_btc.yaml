markets:
  a:
    exchange: BINANCE
    symbol: BTC_USDT
    execution_size: '0.002'
  b:
    exchange: COINCHECK
    symbol: BTC_SPOT
    execution_size: '0.002'
target:
  exchange: COINCHECK
  symbol: BTC_SPOT
  execution_size: '0.002'
schedule: nofilter
directions:
  basis_lvl_300: zscore(a_mid / b_mid, 300)
  basis_lvl_900: zscore(a_mid / b_mid, 900)
  basis_lvl_1800: zscore(a_mid / b_mid, 1800)
  basis_lvl_3600: zscore(a_mid / b_mid, 3600)
  basis_emadiff2: zscore(ema(diff(a_mid / b_mid, 1), 2), 1800)
  basis_emadiff5: zscore(ema(diff(a_mid / b_mid, 1), 5), 1800)
  basis_emadiff30: zscore(ema(diff(a_mid / b_mid, 1), 30), 1800)
  wimb_k1: zscore(a_bs_weighted_imb_k1, 1800)
  wimb_k1_ed2: zscore(ema(diff(a_bs_weighted_imb_k1, 1), 2), 1800)
  wimb_k5: zscore(a_bs_weighted_imb_k5, 1800)
  wimb_k5_ed2: zscore(ema(diff(a_bs_weighted_imb_k5, 1), 2), 1800)
  wimb_k10: zscore(a_bs_weighted_imb_k10, 1800)
  wimb_k10_ed2: zscore(ema(diff(a_bs_weighted_imb_k10, 1), 2), 1800)
  obigrad_k1_k10: zscore(a_obi_k1 - a_obi_k10, 1800)
  obi_ema_k5_30s: zscore(a_obi_ema_k5_30s, 1800)
  obi_ema_k5_120s: zscore(a_obi_ema_k5_120s, 1800)
  imb_qty_5s: zscore(a_ta_imbalance_qty_5s, 1800)
  netflow_5s: zscore(a_ta_net_flow_5s, 1800)
  imb_qty_30s: zscore(a_ta_imbalance_qty_30s, 1800)
  netflow_30s: zscore(a_ta_net_flow_30s, 1800)
  imb_qty_60s: zscore(a_ta_imbalance_qty_60s, 1800)
  netflow_60s: zscore(a_ta_net_flow_60s, 1800)
  mom_30: zscore(ret(a_mid, 30), 1800)
  mom_300: zscore(ret(a_mid, 300), 1800)
  mom_900: zscore(ret(a_mid, 900), 1800)
  mom_3600: zscore(ret(a_mid, 3600), 1800)
  revert_1800: -zscore(a_mid, 1800)
  revert_3600: -zscore(a_mid, 3600)
  mpoff_k1: zscore(a_bs_microprice_k1 / a_mid - 1, 1800)
  mpoff_k5: zscore(a_bs_microprice_k5 / a_mid - 1, 1800)
  vwapdev_10s: zscore(a_mid / a_ta_vwap_10s - 1, 1800)
  vwapdev_60s: zscore(a_mid / a_ta_vwap_60s - 1, 1800)
  blend: zscore(0.017090*(zscore(a_mid / b_mid, 900)) + -0.011150*(zscore(a_obi_ema_k5_30s, 1800)) + 0.028638*(zscore(a_mid / a_ta_vwap_10s - 1, 1800)) + -0.012230*(zscore(a_obi_k1 - a_obi_k10, 1800)) +
    0.040049*(zscore(a_bs_weighted_imb_k1, 1800)) + 0.040298*(zscore(a_bs_weighted_imb_k5, 1800)), 1800)
  blend_ema60: ema(zscore(0.017090*(zscore(a_mid / b_mid, 900)) + -0.011150*(zscore(a_obi_ema_k5_30s, 1800)) + 0.028638*(zscore(a_mid / a_ta_vwap_10s - 1, 1800)) + -0.012230*(zscore(a_obi_k1 - a_obi_k10,
    1800)) + 0.040049*(zscore(a_bs_weighted_imb_k1, 1800)) + 0.040298*(zscore(a_bs_weighted_imb_k5, 1800)), 1800), 60)
  blend_ema300: ema(zscore(0.017090*(zscore(a_mid / b_mid, 900)) + -0.011150*(zscore(a_obi_ema_k5_30s, 1800)) + 0.028638*(zscore(a_mid / a_ta_vwap_10s - 1, 1800)) + -0.012230*(zscore(a_obi_k1 - a_obi_k10,
    1800)) + 0.040049*(zscore(a_bs_weighted_imb_k1, 1800)) + 0.040298*(zscore(a_bs_weighted_imb_k5, 1800)), 1800), 300)
