schema_version: 1
hypothesis:
  id: hyp-20260618-001-v04
  parent_id: hyp-20260618-001
  title: BINANCE ETH_USDT order book imbalance predicts GMO ETH_SPOT 120s mid return (negative-fee market)
  status: draft
  family: order_book_imbalance
  family_label: Order book imbalance
  custom_family_justification: null
  created_at: '2026-06-19T00:00:00Z'
  owner: agent
  summary: Same imbalance mechanism as hyp-20260618-001, tested on GMO ETH_SPOT -- a limit-only, negative-fee
    (-0.01%, i.e. a maker rebate) market instead of the 0%-fee leveraged pair, to test whether the much
    lower cost hurdle changes the verdict.
  expected_edge_mechanism: 'Same mechanism as hyp-20260618-001. Measured directly for this exact market
    and window (2026-05-25..31, the only window GMO ETH_SPOT has bronze data for): BINANCE leads on 87.5-100%
    of days (markets/registry.yaml''s listed -0.01% fee_bps for this market is a maker rebate -- v1 scanner
    assumes the limit order fills at the quoted price; real fill risk is a documented, deliberately deferred
    gap, not silently assumed away).'
  economic_rationale: Same mechanism as hyp-20260618-001.
  duplicate_search:
    searched_at: '2026-06-19T00:00:00Z'
    query_terms:
    - order_book_imbalance
    - ETH_USDT
    - ETH_SPOT
    possible_duplicates:
    - hyp-20260618-001
    conclusion: variant
  data_requirements:
    markets:
    - exchange: BINANCE
      symbol: ETH_USDT
    - exchange: GMO
      symbol: ETH_SPOT
    datasets:
    - layer: bronze
      dataset: OrderBook
    minimum_distinct_days: 5
    required_columns:
    - bid0_price
    - bid0_qty
    - ask0_price
    - ask0_qty
    unavailable_data_policy: needs-more-data
    research_metadata: null
  feature:
    sql_expression: (bid0_qty - ask0_qty) / (bid0_qty + ask0_qty)
    source_datasets:
    - layer: bronze
      dataset: OrderBook
      exchange: BINANCE
      symbol: ETH_USDT
    primary_timestamp_column: ts
    point_in_time_rule: feature computed strictly from rows at or before signal ts; window frames (if
      any) are bounded and strictly backward-looking
  cross_market_rationale: 'Feature computed on BINANCE:ETH_USDT, target on GMO:ETH_SPOT. Measured directly
    for this exact window (not assumed): BINANCE led on 87.5-100% of the 8 scanned days, mean peak lag
    ~1.1-1.4s, mean correlation at that lag higher than at zero lag.'
  target:
    type: next_return
    primary_horizon_seconds: 120
    comparison_horizons_seconds:
    - 30
    - 120
    - 300
    source_dataset:
      layer: bronze
      dataset: OrderBook
      exchange: GMO
      symbol: ETH_SPOT
    timestamp_cutoff_rule: target window starts strictly after signal timestamp
  execution_assumptions:
    order_type: limit
    fees_bps: -0.01
    slippage_bps: 0.5
    latency_ms: 100
    liquidity_capacity_assumption: single-unit notional, no capacity scaling in v1 scan
  falsification_tests:
  - name: negative-fee-does-not-flip-verdict-eth
    expected_failure_meaning: even with a maker rebate instead of a fee, edge still doesn't clear the
      (much lower) required cost buffer
  scan_plan:
    primary_horizon_seconds: 120
