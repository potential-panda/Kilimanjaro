schema_version: 1
hypothesis:
  id: hyp-20260713-001
  parent_id: hyp-20260618-001
  title: "BINANCE ETH_USDT OBI EMA with threshold-age window predicts GMO ETH_JPY fixed-horizon mid return"
  status: draft
  family: order_book_imbalance
  family_label: "Order book imbalance"
  custom_family_justification: null
  created_at: "2026-07-13T00:00:00Z"
  owner: agent
  summary: >
    EMA-smoothed multi-level order book imbalance on BINANCE ETH_USDT, gated
    by the AGE of the current threshold-crossing episode (how long |OBI| has
    been above the threshold), as a directional signal for GMO ETH_JPY at
    fixed horizons. Extends hyp-20260618-001 (raw top-of-book imbalance, BTC)
    with depth aggregation, EMA smoothing, and the age window — fresh
    crossings are noisy, exhausted episodes are late; the tradeable part is
    the confirmed middle.
  expected_edge_mechanism: >
    BINANCE leads GMO at 600-1000ms with ~100% daily lead share year-round
    (doc/lead-lag-2026-investigation.md). Persistent one-sided book pressure
    on the leader precedes multi-second drift that the follower has not yet
    priced. The age filter separates persistent pressure (informative) from
    single-snapshot noise (not).
  economic_rationale: "Liquidity providers reprice GMO with a lag after sustained BINANCE order-flow pressure."
  duplicate_search:
    searched_at: "2026-07-13T00:00:00Z"
    query_terms:
      - imbalance
      - OBI
      - age
      - ETH
    possible_duplicates:
      - hyp-20260618-001
    conclusion: variant
  data_requirements:
    markets:
      - exchange: BINANCE
        symbol: ETH_USDT
      - exchange: GMO
        symbol: ETH_JPY
    datasets:
      - layer: bronze
        dataset: OrderBook
    minimum_distinct_days: 30
    required_columns: ["bid0_price", "bid0_qty", "ask0_price", "ask0_qty"]
    unavailable_data_policy: needs-more-data
    research_metadata:
      note: >
        Scans read the derived feature dataset=OBIFeature (1s resample,
        ema_k{depth}_{halflife}s columns) built from bronze OrderBook;
        coverage currently 2026-05-01..2026-06-30.
  feature:
    sql_expression: "(bid_qty_sum_k - ask_qty_sum_k) / (bid_qty_sum_k + ask_qty_sum_k)"
    source_datasets:
      - layer: bronze
        dataset: OrderBook
        exchange: BINANCE
        symbol: ETH_USDT
    primary_timestamp_column: ts
    point_in_time_rule: >
      OBI EMA and its threshold-age computed strictly from BINANCE OrderBook
      rows at or before signal ts; age counts consecutive seconds with
      |OBI| > threshold ending at ts.
  cross_market_rationale: >
    Feature is computed on BINANCE:ETH_USDT; target return is on GMO:ETH_JPY.
    Verified lead-lag: BINANCE leads GMO ETH at 600-1000ms optimal lag,
    ~100% of days across 2025-07..2026-06 (doc/lead-lag-2026-investigation.md).
  target:
    type: next_return
    primary_horizon_seconds: 120
    comparison_horizons_seconds: [10, 30, 60, 120, 300, 600]
    source_dataset:
      layer: silver
      dataset: MarketPrice
      exchange: GMO
      symbol: ETH_JPY
    timestamp_cutoff_rule: "target window starts strictly after signal timestamp"
  execution_assumptions:
    order_type: market
    fees_bps: 0  # GMO ETH_JPY fee_bps=0 -- authoritative
    slippage_bps: 0.5  # default_slippage_bps -- authoritative
    latency_ms: 100
    liquidity_capacity_assumption: "single-unit notional (0.3 ETH), no capacity scaling in v1 scan"
  falsification_tests:
    - name: "signal-count-regime-fragility"
      expected_failure_meaning: >
        signal frequency collapses across months (e.g. thresholds that fire
        in May produce zero signals in June) — the OBI level distribution is
        regime-dependent and absolute thresholds do not transfer
    - name: "rank-instability-across-split"
      expected_failure_meaning: >
        combos in the top decile of the train window fall out of the top
        decile on the holdout window — apparent edge was selection noise
  scan_plan:
    primary_horizon_seconds: 120
    threshold_grid: [10, 30, 60, 120, 300, 600]
    regime_buckets: ["low_vol", "mid_vol", "high_vol"]
    significance_method: block_bootstrap_by_day
  backtest_handoff_intent:
    potential_panda_core_strategy_pattern: "qate.trading.strategy variant, OBI-age threshold entry, fixed-horizon exit"
    himalaya_config_notes: "GMO/ETH_JPY, execution_size 0.3; only if a rank-stable combo survives multi-month holdout"
  decisions:
    - at: "2026-07-13T00:00:00Z"
      actor: agent
      decision: draft
      reason: >
        Spec created retroactively to close the ledger loop for the horizon
        grid scans already run (results/grid_scan/horizon/); extends
        hyp-20260618-001 with EMA depth aggregation and age windows.
